name: Build and deploy Node.js app to Azure Web App - MithraBirthday

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./MithraBirthday
        # change ./MithraBirthday to the folder that contains package.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug files
        run: ls -R

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./MithraBirthday/package-lock.json
          # change path if your package-lock.json is in a different folder

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build --if-present

      - name: Test app
        run: npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./MithraBirthday
          # change this to the app folder you want to deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E8D378ED3BCF433A8F3C4A64FC17BE5A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5AD0B21D76EF454E80516CB3A5CAC0FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DEB8830E00994A7D881E61907E96591C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: MithraBirthday
          slot-name: Production
          package: .
